<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giviso Vocabulary Neural Game - V4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #06b6d4; --bg: #050508; }
        body { 
            background: var(--bg); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .font-futuristic { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Hiệu ứng hào quang cho từ vựng */
        .word-glow { 
            text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan); 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.9; transform: scale(1.02); } 
        }

        /* Kim chỉ vòng quay */
        #pointer { 
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 35px solid #f43f5e; z-index: 20;
            filter: drop-shadow(0 0 10px #f43f5e);
        }

        canvas { transition: filter 0.5s; }
        .spinning canvas { filter: blur(1px); }
    </style>
</head>
<body>

    <!-- Header HUD -->
    <div class="fixed top-10 text-center z-50">
        <h1 class="font-futuristic text-4xl text-cyan-400 tracking-[0.2em] uppercase mb-2">Neural_Spin_V4</h1>
        <div class="flex items-center justify-center gap-4">
            <span class="h-[1px] w-12 bg-cyan-500/30"></span>
            <p class="text-[9px] text-gray-500 tracking-[0.4em] uppercase">Vocalulary Learning Engine</p>
            <span class="h-[1px] w-12 bg-cyan-500/30"></span>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row items-center gap-16 mt-10">
        
        <!-- Wheel Container -->
        <div class="relative group" id="wheel-wrapper">
            <div id="pointer"></div>
            <canvas id="wheel" width="540" height="540" class="rounded-full shadow-[0_0_80px_rgba(6,182,212,0.15)]"></canvas>
            <button onclick="spin()" id="spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-black border-4 border-cyan-500 rounded-full font-futuristic text-cyan-400 text-[10px] hover:bg-cyan-500 hover:text-black transition-all duration-300 z-30 shadow-[0_0_30px_rgba(6,182,212,0.4)] uppercase font-bold tracking-widest">Start</button>
        </div>

        <!-- Display Area -->
        <div id="display-area" class="w-[450px] h-[350px] glass rounded-[2.5rem] flex flex-col items-center justify-center p-10 text-center relative overflow-hidden border-t-2 border-cyan-500/20 shadow-2xl">
            <div id="topic-badge" class="absolute top-8 px-5 py-1.5 bg-cyan-500/10 border border-cyan-500/50 rounded-full text-[10px] text-cyan-400 font-futuristic uppercase tracking-widest hidden">Topic: ...</div>
            
            <div id="word-container" class="hidden">
                <h2 id="word-en" class="text-6xl font-bold text-white mb-5 word-glow">Word</h2>
                <p id="word-vi" class="text-2xl text-cyan-400/80 italic font-light tracking-wide">Nghĩa tiếng Việt</p>
                
                <!-- Progress Bars -->
                <div class="mt-12 flex gap-3 justify-center" id="progress-dots"></div>
            </div>

            <div id="idle-text" class="text-gray-500 text-sm font-light tracking-widest uppercase opacity-50">
                <svg class="w-12 h-12 mx-auto mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7m0 0l-7-7m7 7V3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                Quay vòng quay để bắt đầu
            </div>
        </div>
    </div>

    <script>
        // 1. Dữ liệu 20 chủ đề x 6 từ
        const topics = [
            { name: "Family", words: [["Father", "Cha"], ["Mother", "Mẹ"], ["Brother", "Anh/Em trai"], ["Sister", "Chị/Em gái"], ["Grandparent", "Ông bà"], ["Cousin", "Anh em họ"]] },
            { name: "Food", words: [["Bread", "Bánh mì"], ["Rice", "Cơm"], ["Soup", "Súp"], ["Pizza", "Pizza"], ["Salad", "Salad"], ["Steak", "Bít tết"]] },
            { name: "Travel", words: [["Airport", "Sân bay"], ["Hotel", "Khách sạn"], ["Passport", "Hộ chiếu"], ["Suitcase", "Va li"], ["Ticket", "Vé"], ["Beach", "Bãi biển"]] },
            { name: "Work", words: [["Doctor", "Bác sĩ"], ["Teacher", "Giáo viên"], ["Engineer", "Kỹ sư"], ["Farmer", "Nông dân"], ["Artist", "Họa sĩ"], ["Nurse", "Y tá"]] },
            { name: "Body", words: [["Head", "Đầu"], ["Hand", "Tay"], ["Leg", "Chân"], ["Eye", "Mắt"], ["Ear", "Tai"], ["Heart", "Tim"]] },
            { name: "Tech", words: [["Computer", "Máy tính"], ["Software", "Phần mềm"], ["Internet", "Mạng"], ["Robot", "Rô bốt"], ["Data", "Dữ liệu"], ["Screen", "Màn hình"]] },
            { name: "Nature", words: [["Mountain", "Núi"], ["River", "Sông"], ["Forest", "Rừng"], ["Ocean", "Đại dương"], ["Flower", "Hoa"], ["Cloud", "Mây"]] },
            { name: "Emotion", words: [["Happy", "Hạnh phúc"], ["Angry", "Giận dữ"], ["Sad", "Buồn rầu"], ["Brave", "Dũng cảm"], ["Scared", "Sợ hãi"], ["Surprised", "Ngạc nhiên"]] },
            { name: "Office", words: [["Meeting", "Cuộc họp"], ["Salary", "Lương"], ["Colleague", "Đồng nghiệp"], ["Project", "Dự án"], ["Document", "Tài liệu"], ["Desk", "Bàn làm việc"]] },
            { name: "Action", words: [["Run", "Chạy"], ["Jump", "Nhảy"], ["Swim", "Bơi"], ["Speak", "Nói"], ["Listen", "Nghe"], ["Think", "Suy nghĩ"]] },
            { name: "Animal", words: [["Lion", "Sư tử"], ["Elephant", "Voi"], ["Tiger", "Hổ"], ["Bird", "Chim"], ["Fish", "Cá"], ["Snake", "Rắn"]] },
            { name: "Weather", words: [["Sunny", "Nắng"], ["Rainy", "Mưa"], ["Windy", "Gió"], ["Stormy", "Bão"], ["Snowy", "Tuyết"], ["Foggy", "Sương mù"]] },
            { name: "Fruit", words: [["Apple", "Táo"], ["Banana", "Chuối"], ["Mango", "Xoài"], ["Grapes", "Nho"], ["Orange", "Cam"], ["Lemon", "Chanh"]] },
            { name: "School", words: [["Lesson", "Bài học"], ["Student", "Học sinh"], ["Library", "Thư viện"], ["Homework", "Bài tập về nhà"], ["Exam", "Kỳ thi"], ["Eraser", "Cục tẩy"]] },
            { name: "City", words: [["Street", "Đường phố"], ["Bridge", "Cây cầu"], ["Building", "Tòa nhà"], ["Park", "Công viên"], ["Cinema", "Rạp phim"], ["Market", "Chợ"]] },
            { name: "Color", words: [["Red", "Đỏ"], ["Blue", "Xanh dương"], ["Green", "Xanh lá"], ["Yellow", "Vàng"], ["Purple", "Tím"], ["Black", "Đen"]] },
            { name: "Music", words: [["Guitar", "Đàn ghi-ta"], ["Piano", "Đàn piano"], ["Singer", "Ca sĩ"], ["Song", "Bài hát"], ["Rhythm", "Giai điệu"], ["Concert", "Buổi hòa nhạc"]] },
            { name: "Kitchen", words: [["Knife", "Con dao"], ["Spoon", "Cái thìa"], ["Plate", "Cái đĩa"], ["Stove", "Cái bếp"], ["Fridge", "Tủ lạnh"], ["Pot", "Cái nồi"]] },
            { name: "Cloth", words: [["Shirt", "Áo sơ mi"], ["Pants", "Quần dài"], ["Shoes", "Giày"], ["Hat", "Mũ"], ["Dress", "Váy"], ["Jacket", "Áo khoác"]] },
            { name: "Time", words: [["Minute", "Phút"], ["Second", "Giây"], ["Hour", "Giờ"], ["Day", "Ngày"], ["Month", "Tháng"], ["Year", "Năm"]] }
        ];

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const numSlices = topics.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;
        let isSpinning = false;

        // Vẽ vòng quay
        function drawWheel() {
            ctx.clearRect(0,0,540,540);
            topics.forEach((topic, i) => {
                const angle = i * sliceAngle + currentRotation;
                ctx.beginPath();
                ctx.moveTo(270, 270);
                ctx.arc(270, 270, 260, angle, angle + sliceAngle);
                ctx.fillStyle = i % 2 === 0 ? "#0a0f1e" : "#06b6d411";
                ctx.fill();
                ctx.strokeStyle = "#06b6d444";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(270, 270);
                ctx.rotate(angle + sliceAngle/2);
                ctx.fillStyle = i % 2 === 0 ? "#64748b" : "#06b6d4";
                ctx.font = "bold 9px Orbitron";
                ctx.fillText(topic.name.toUpperCase(), 140, 5);
                ctx.restore();
            });
        }
        drawWheel();

        // Phát âm
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        // Quay vòng quay
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('wheel-wrapper').classList.add('spinning');
            
            // UI Reset
            document.getElementById('idle-text').classList.add('hidden');
            document.getElementById('word-container').classList.add('hidden');
            document.getElementById('topic-badge').classList.add('hidden');

            const spinRotation = Math.random() * 3600 + 3600; 
            const duration = 5000;
            let start = null;

            function animate(timestamp) {
                if (!start) start = timestamp;
                const progress = timestamp - start;
                const easeOut = 1 - Math.pow(1 - progress / duration, 4);
                currentRotation = (easeOut * spinRotation * Math.PI) / 180;
                drawWheel();

                if (progress < duration) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('wheel-wrapper').classList.remove('spinning');
                    determineWinner();
                }
            }
            requestAnimationFrame(animate);
        }

        function determineWinner() {
            const normalizedRotation = (currentRotation % (2 * Math.PI));
            const winningIndex = Math.floor((numSlices - (normalizedRotation / sliceAngle)) % numSlices);
            const selectedTopic = topics[winningIndex];
            startLearning(selectedTopic);
        }

        function startLearning(topic) {
            const wordContainer = document.getElementById('word-container');
            const topicBadge = document.getElementById('topic-badge');
            const dotsContainer = document.getElementById('progress-dots');

            wordContainer.classList.remove('hidden');
            topicBadge.classList.remove('hidden');
            topicBadge.innerText = `Topic: ${topic.name}`;
            
            dotsContainer.innerHTML = '';
            for(let i=0; i<6; i++) {
                const dot = document.createElement('div');
                dot.className = "w-2 h-2 rounded-full bg-white/5 transition-all duration-700";
                dotsContainer.appendChild(dot);
            }

            let wordIndex = 0;
            const interval = setInterval(() => {
                if (wordIndex >= 6) {
                    clearInterval(interval);
                    return;
                }

                const [en, vi] = topic.words[wordIndex];
                
                // Hiệu ứng Fade text
                const wordEnEl = document.getElementById('word-en');
                wordEnEl.style.opacity = 0;
                
                setTimeout(() => {
                    wordEnEl.innerText = en;
                    document.getElementById('word-vi').innerText = vi;
                    wordEnEl.style.opacity = 1;
                    speak(en);
                }, 200);

                // Update progress dots
                Array.from(dotsContainer.children).forEach((dot, idx) => {
                    if(idx === wordIndex) {
                        dot.className = "w-8 h-2 rounded-full bg-cyan-500 shadow-[0_0_15px_#06b6d4]";
                    } else if (idx < wordIndex) {
                        dot.className = "w-2 h-2 rounded-full bg-cyan-900";
                    } else {
                        dot.className = "w-2 h-2 rounded-full bg-white/5";
                    }
                });

                wordIndex++;
            }, 3000); 
        }
    </script>
</body>
</html>
