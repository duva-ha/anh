<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Neural Game Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #06b6d4; --bg: #050508; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .font-futuristic { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active-screen { display: flex; }
        .btn-main { transition: all 0.3s; border: 1px solid rgba(6, 182, 212, 0.3); cursor: pointer; }
        .btn-main:hover { background: var(--cyan); color: black; box-shadow: 0 0 20px var(--cyan); }
    </style>
</head>
<body>

    <!-- Màn hình 1: Chọn Chế Độ -->
    <div id="screen-1" class="screen active-screen">
        <h1 class="font-futuristic text-4xl text-cyan-400 mb-12 tracking-widest uppercase">Mode Selection</h1>
        <div class="flex gap-8">
            <div id="select-vocab" class="btn-main glass px-12 py-6 rounded-2xl text-xl font-bold uppercase">Từ vựng</div>
            <div id="select-sentence" class="btn-main glass px-12 py-6 rounded-2xl text-xl font-bold uppercase">Câu hỏi</div>
        </div>
    </div>

    <!-- Màn hình 2: Chọn Chủ Đề -->
    <div id="screen-2" class="screen">
        <h1 class="font-futuristic text-2xl text-cyan-400 mb-8 uppercase">Select Topic</h1>
        <div id="topic-grid" class="grid grid-cols-5 gap-4 p-10 max-w-5xl overflow-y-auto max-h-[70vh]"></div>
        <button id="back-to-1" class="mt-8 text-gray-500 hover:text-white uppercase text-xs tracking-widest">Quay lại</button>
    </div>

    <!-- Màn hình 3: Chọn Game -->
    <div id="screen-3" class="screen">
        <h1 class="font-futuristic text-2xl text-cyan-400 mb-12 uppercase">Select Game</h1>
        <div id="game-options" class="flex gap-8"></div>
        <button id="back-to-2" class="mt-8 text-gray-500 hover:text-white uppercase text-xs tracking-widest">Quay lại</button>
    </div>

    <!-- Màn hình 4: Sân chơi -->
    <div id="screen-4" class="screen">
        <div class="absolute top-10 flex justify-between w-full px-20">
            <span id="game-title" class="font-futuristic text-cyan-500"></span>
            <button id="exit-game" class="text-red-500 uppercase text-xs font-bold">Thoát Game</button>
        </div>
        <div id="game-content" class="w-full h-full flex items-center justify-center"></div>
    </div>

    <!-- KẾT NỐI ENGINE CHÍNH -->
    <script type="module" src="main.js"></script>
</body>
</html>
