<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Neural Game Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #06b6d4; --bg: #050508; }
        body { 
            background: var(--bg); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            margin: 0;
        }
        .font-futuristic { font-family: 'Orbitron', sans-serif; }
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .screen { 
            display: none; 
            height: 100vh; 
            width: 100vw; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        .active-screen { display: flex; }
        .btn-main { 
            transition: all 0.3s; 
            border: 1px solid rgba(6, 182, 212, 0.3); 
            cursor: pointer; 
        }
        .btn-main:hover { 
            background: var(--cyan); 
            color: black; 
            box-shadow: 0 0 20px var(--cyan); 
        }
        /* Tùy chỉnh thanh cuộn cho danh sách chủ đề */
        #topic-grid::-webkit-scrollbar { width: 6px; }
        #topic-grid::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.3); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Màn hình 1: Chọn Chế Độ (Từ vựng hoặc Câu) -->
    <div id="screen-1" class="screen active-screen">
        <h1 class="font-futuristic text-4xl text-cyan-400 mb-12 tracking-widest uppercase text-center">Mode Selection</h1>
        <div class="flex gap-8">
            <div id="select-vocab" class="btn-main glass px-12 py-6 rounded-2xl text-xl font-bold uppercase">Từ vựng</div>
            <div id="select-sentence" class="btn-main glass px-12 py-6 rounded-2xl text-xl font-bold uppercase">Câu hỏi</div>
        </div>
    </div>

    <!-- Màn hình 2: Chọn Chủ Đề (30 chủ đề) -->
    <div id="screen-2" class="screen">
        <h1 class="font-futuristic text-2xl text-cyan-400 mb-8 uppercase tracking-wider">Select Topic</h1>
        <div id="topic-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 p-6 max-w-6xl overflow-y-auto max-h-[70vh]">
            <!-- Chủ đề sẽ được render tự động từ JS -->
        </div>
        <button id="back-to-1" class="mt-8 text-gray-500 hover:text-white uppercase text-xs tracking-widest border-b border-transparent hover:border-white transition-all">
            &larr; Quay lại
        </button>
    </div>

    <!-- Màn hình 3: Chọn Loại Game -->
    <div id="screen-3" class="screen">
        <h1 class="font-futuristic text-2xl text-cyan-400 mb-12 uppercase tracking-wider">Select Game</h1>
        <div id="game-options" class="flex flex-wrap justify-center gap-8 px-10">
            <!-- Các nút Game (Nối từ, Ghép câu...) render tại đây -->
        </div>
        <button id="back-to-2" class="mt-8 text-gray-500 hover:text-white uppercase text-xs tracking-widest border-b border-transparent hover:border-white transition-all">
            &larr; Đổi chủ đề
        </button>
    </div>

    <!-- Màn hình 4: Không gian chơi Game -->
    <div id="screen-4" class="screen">
        <!-- HUD Header -->
        <div class="absolute top-8 flex justify-between w-full px-12 md:px-20 items-center">
            <div class="flex flex-col">
                <span id="game-title" class="font-futuristic text-cyan-500 text-sm tracking-widest">GAME STARTING...</span>
                <div class="h-1 w-24 bg-cyan-500/20 mt-1"><div id="progress-bar" class="h-full bg-cyan-500 w-0 transition-all duration-500"></div></div>
            </div>
            <button id="exit-game" class="text-red-500 border border-red-500/30 px-4 py-1 rounded hover:bg-red-500 hover:text-white transition-all uppercase text-[10px] font-bold tracking-tighter">
                Thoát Game
            </button>
        </div>

        <!-- Nội dung game chính -->
        <div id="game-content" class="w-full h-full flex items-center justify-center p-4">
            <!-- Logic game sẽ vẽ giao diện vào đây -->
        </div>
    </div>

    <!-- Import Module chính điều khiển toàn bộ ứng dụng -->
    <!-- Lưu ý: Phải dùng type="module" để các lệnh import trong main.js hoạt động -->
    <script type="module" src="main.js"></script>
</body>
</html>
