<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Neural Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #06b6d4; --bg: #050508; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .font-futuristic { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Hiệu ứng hào quang cho từ vựng */
        .word-glow { text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

        /* Kim chỉ vòng quay */
        #pointer { 
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid #ff4d4d; z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- HUD Tiêu đề -->
    <div class="fixed top-10 text-center">
        <h1 class="font-futuristic text-3xl text-cyan-400 tracking-widest uppercase">Vocabulary Quest</h1>
        <p class="text-[10px] text-gray-500 tracking-[0.3em]">NEURAL LEARNING SYSTEM V4.0</p>
    </div>

    <div class="flex flex-row items-center gap-20">
        
        <!-- Khu vực Vòng quay -->
        <div class="relative">
            <div id="pointer"></div>
            <canvas id="wheel" width="500" height="500" class="rounded-full shadow-[0_0_50px_rgba(6,182,212,0.2)]"></canvas>
            <button onclick="spin()" id="spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-black border-4 border-cyan-500 rounded-full font-futuristic text-cyan-400 text-xs hover:bg-cyan-500 hover:text-black transition-all shadow-[0_0_20px_rgba(6,182,212,0.5)]">START</button>
        </div>

        <!-- Khu vực hiển thị từ vựng -->
        <div id="display-area" class="w-[400px] h-[300px] glass rounded-3xl flex flex-col items-center justify-center p-8 text-center relative overflow-hidden">
            <div id="topic-badge" class="absolute top-6 px-4 py-1 border border-cyan-500/50 rounded-full text-[10px] text-cyan-500 font-futuristic uppercase hidden">Topic: ...</div>
            
            <div id="word-container" class="hidden">
                <h2 id="word-en" class="text-5xl font-bold text-white mb-4 word-glow">Word</h2>
                <p id="word-vi" class="text-xl text-cyan-400/70 italic font-light">Nghĩa tiếng Việt</p>
                <div class="mt-8 flex gap-2 justify-center" id="progress-dots">
                    <!-- Dots sinh ra tự động -->
                </div>
            </div>

            <div id="idle-text" class="text-gray-500 text-sm font-light italic">
                Quay vòng quay để bắt đầu học...
            </div>
        </div>
    </div>

    <script>
        // 1. Dữ liệu 20 chủ đề (mỗi chủ đề 6 từ)
        const topics = [
            { name: "Family", words: [["Father", "Cha"], ["Mother", "Mẹ"], ["Brother", "Anh/Em trai"], ["Sister", "Chị/Em gái"], ["Grandparent", "Ông bà"], ["Cousin", "Anh em họ"]] },
            { name: "Food", words: [["Bread", "Bánh mì"], ["Rice", "Cơm"], ["Soup", "Súp"], ["Pizza", "Pizza"], ["Salad", "Salad"], ["Steak", "Bít tết"]] },
            { name: "Travel", words: [["Airport", "Sân bay"], ["Hotel", "Khách sạn"], ["Passport", "Hộ chiếu"], ["Suitcase", "Va li"], ["Ticket", "Vé"], ["Beach", "Bãi biển"]] },
            { name: "Job", words: [["Doctor", "Bác sĩ"], ["Teacher", "Giáo viên"], ["Engineer", "Kỹ sư"], ["Farmer", "Nông dân"], ["Artist", "Họa sĩ"], ["Nurse", "Y tá"]] },
            { name: "Body", words: [["Head", "Đầu"], ["Hand", "Tay"], ["Leg", "Chân"], ["Eye", "Mắt"], ["Ear", "Tai"], ["Heart", "Tim"]] },
            { name: "Tech", words: [["Computer", "Máy tính"], ["Software", "Phần mềm"], ["Internet", "Mạng"], ["Robot", "Rô bốt"], ["Data", "Dữ liệu"], ["Screen", "Màn hình"]] },
            { name: "Nature", words: [["Mountain", "Núi"], ["River", "Sông"], ["Forest", "Rừng"], ["Ocean", "Đại dương"], ["Flower", "Hoa"], ["Cloud", "Mây"]] },
            { name: "Emotion", words: [["Happy", "Hạnh phúc"], ["Angry", "Giận dữ"], ["Sad", "Buồn rầu"], ["Brave", "Dũng cảm"], ["Scared", "Sợ hãi"], ["Surprised", "Ngạc nhiên"]] },
            { name: "Office", words: [["Meeting", "Cuộc họp"], ["Salary", "Lương"], ["Colleague", "Đồng nghiệp"], ["Project", "Dự án"], ["Document", "Tài liệu"], ["Desk", "Bàn làm việc"]] },
            { name: "Action", words: [["Run", "Chạy"], ["Jump", "Nhảy"], ["Swim", "Bơi"], ["Speak", "Nói"], ["Listen", "Nghe"], ["Think", "Suy nghĩ"]] },
            { name: "Animal", words: [["Lion", "Sư tử"], ["Elephant", "Voi"], ["Tiger", "Hổ"], ["Bird", "Chim"], ["Fish", "Cá"], ["Snake", "Rắn"]] },
            { name: "Weather", words: [["Sunny", "Nắng"], ["Rainy", "Mưa"], ["Windy", "Gió"], ["Stormy", "Bão"], ["Snowy", "Tuyết"], ["Foggy", "Sương mù"]] },
            { name: "Fruit", words: [["Apple", "Táo"], ["Banana", "Chuối"], ["Mango", "Xoài"], ["Grapes", "Nho"], ["Orange", "Cam"], ["Lemon", "Chanh"]] },
            { name: "School", words: [["Lesson", "Bài học"], ["Student", "Học sinh"], ["Library", "Thư viện"], ["Homework", "Bài tập về nhà"], ["Exam", "Kỳ thi"], ["Eraser", "Cục tẩy"]] },
            { name: "City", words: [["Street", "Đường phố"], ["Bridge", "Cây cầu"], ["Building", "Tòa nhà"], ["Park", "Công viên"], ["Cinema", "Rạp phim"], ["Market", "Chợ"]] },
            { name: "Color", words: [["Red", "Đỏ"], ["Blue", "Xanh dương"], ["Green", "Xanh lá"], ["Yellow", "Vàng"], ["Purple", "Tím"], ["Black", "Đen"]] },
            { name: "Music", words: [["Guitar", "Đàn ghi-ta"], ["Piano", "Đàn piano"], ["Singer", "Ca sĩ"], ["Song", "Bài hát"], ["Rhythm", "Giai điệu"], ["Concert", "Buổi hòa nhạc"]] },
            { name: "Kitchen", words: [["Knife", "Con dao"], ["Spoon", "Cái thìa"], ["Plate", "Cái đĩa"], ["Stove", "Cái bếp"], ["Fridge", "Tủ lạnh"], ["Pot", "Cái nồi"]] },
            { name: "Clothing", words: [["Shirt", "Áo sơ mi"], ["Pants", "Quần dài"], ["Shoes", "Giày"], ["Hat", "Mũ"], ["Dress", "Váy"], ["Jacket", "Áo khoác"]] },
            { name: "Time", words: [["Minute", "Phút"], ["Second", "Giây"], ["Hour", "Giờ"], ["Day", "Ngày"], ["Month", "Tháng"], ["Year", "Năm"]] }
        ];

        // 2. Vẽ vòng quay
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const numSlices = topics.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        function drawWheel() {
            ctx.clearRect(0,0,500,500);
            topics.forEach((topic, i) => {
                const angle = i * sliceAngle + currentRotation;
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 240, angle, angle + sliceAngle);
                ctx.fillStyle = i % 2 === 0 ? "#0d112d" : "#06b6d422";
                ctx.fill();
                ctx.strokeStyle = "#06b6d455";
                ctx.stroke();

                // Vẽ chữ
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + sliceAngle/2);
                ctx.fillStyle = "#06b6d4";
                ctx.font = "bold 10px Orbitron";
                ctx.fillText(topic.name, 120, 5);
                ctx.restore();
            });
        }
        drawWheel();

        // 3. Logic quay
        let isSpinning = false;
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            
            // Reset UI
            document.getElementById('idle-text').style.display = 'block';
            document.getElementById('word-container').classList.add('hidden');
            document.getElementById('topic-badge').classList.add('hidden');

            const spinRotation = Math.random() * 2000 + 2000; // Quay tối thiểu 2000 độ
            const duration = 4000;
            let start = null;

            function animate(timestamp) {
                if (!start) start = timestamp;
                const progress = timestamp - start;
                const easeOut = 1 - Math.pow(1 - progress / duration, 3);
                currentRotation = (easeOut * spinRotation * Math.PI) / 180;
                drawWheel();

                if (progress < duration) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determineWinner();
                }
            }
            requestAnimationFrame(animate);
        }

        // 4. Xác định chủ đề và hiển thị từ vựng
        function determineWinner() {
            // Tính toán góc dừng (kim chỉ ở góc -90 độ so với trục Canvas)
            const normalizedRotation = (currentRotation % (2 * Math.PI));
            const winningIndex = Math.floor(
                (numSlices - (normalizedRotation / sliceAngle)) % numSlices
            );
            
            const selectedTopic = topics[winningIndex];
            startLearning(selectedTopic);
        }

        function startLearning(topic) {
            const idleText = document.getElementById('idle-text');
            const wordContainer = document.getElementById('word-container');
            const topicBadge = document.getElementById('topic-badge');
            const dotsContainer = document.getElementById('progress-dots');

            idleText.style.display = 'none';
            wordContainer.classList.remove('hidden');
            topicBadge.classList.remove('hidden');
            topicBadge.innerText = `Topic: ${topic.name}`;
            
            // Tạo dots tiến trình
            dotsContainer.innerHTML = '';
            for(let i=0; i<6; i++) {
                const dot = document.createElement('div');
                dot.className = "w-2 h-2 rounded-full bg-white/10 transition-all duration-500";
                dotsContainer.appendChild(dot);
            }

            // Chạy chuỗi từ vựng
            let wordIndex = 0;
            const interval = setInterval(() => {
                if (wordIndex >= 6) {
                    clearInterval(interval);
                    setTimeout(() => {
                        alert(`Hoàn thành chủ đề: ${topic.name}!`);
                    }, 1000);
                    return;
                }

                // Cập nhật nội dung
                const [en, vi] = topic.words[wordIndex];
                document.getElementById('word-en').innerText = en;
                document.getElementById('word-vi').innerText = vi;

                // Cập nhật dots
                Array.from(dotsContainer.children).forEach((dot, idx) => {
                    dot.className = idx <= wordIndex ? "w-4 h-2 rounded-full bg-cyan-500 shadow-[0_0_10px_#06b6d4]" : "w-2 h-2 rounded-full bg-white/10";
                });

                wordIndex++;
            }, 3000); // 3 giây mỗi từ
        }
    </script>
</body>
</html>
